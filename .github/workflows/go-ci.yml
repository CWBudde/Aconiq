name: Go CI

# Pushes only run CI for `main` (i.e. after a merge). Any other branch is
# covered by the `pull_request` trigger, and the `default-branch` ruleset
# requires a pull request anyway — so `branches: ["**"]` here meant every
# workflow ran twice per pull request, once for the push and once for the PR,
# on the same commit. The trade is that a branch pushed without an open pull
# request gets no CI until the pull request exists.
on:
  push:
    branches: [main]
  pull_request:
  # Daily, for the govulncheck job only (the other two are skipped below).
  # govulncheck is a required status check and standard-library advisories land
  # on their own schedule, so without this the first sign of a new one is an
  # unrelated pull request that can no longer merge. A scheduled run finds it
  # first and files an issue.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

# Every gate below is invoked through a `just` recipe so that the justfile stays
# the single source of truth: `just go-ci` runs exactly the same set of checks
# locally. The recipes are split over three jobs that run in parallel, because
# `test-race` and `govulncheck` are slow and independent of the rest.
#
# The only steps that are not `just` recipes are the two artifact-producing ones
# (license report, OpenAPI spec). They publish CI artifacts rather than gate the
# build, so they have no local equivalent — see the comment on the `go-ci`
# recipe in the justfile.
#
# Tool versions live in tools.versions at the repo root — one file, read by this
# workflow and by `just install-tools`, so CI and a developer's machine cannot
# drift. `just check-tools` verifies an installation against it, and `just fmt`
# refuses to run when the formatters do not match.
#
# The `toolchain` composite action below exports those pins into the job and
# installs the groups a job needs.

jobs:
  go-ci:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: `just build` stamps the version, commit and
      # build date into the binary with `git describe --tags`, which reports
      # only the bare commit on the default shallow checkout.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      # One installation recipe for CI and for developers, so the awkward cases
      # (treefmt's release tarball, prettier out of npm rather than globally)
      # are encoded once, in scripts/install-tools.sh.
      - name: Pinned toolchain
        uses: ./.github/actions/toolchain
        with:
          install: format licenses

      - name: Install just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: ${{ env.JUST_VERSION }}

      # golangci-lint-action >= v8 installs the golangci-lint v2 line, which is
      # what the v2 .golangci.yml config requires. `install-only` makes the
      # action a pure installer so the lint invocation itself stays in the
      # justfile (`just lint`) instead of being duplicated in `args:`.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true

      - name: Check formatting
        run: just check-formatted

      - name: Go vet
        run: just vet

      - name: Lint
        run: just lint

      - name: Go tests
        run: just test

      - name: Check tidy
        run: just check-tidy

      - name: Check dependency licenses
        run: just license-check

      - name: Generate license report
        run: just license-report > license-report.csv

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: license-report.csv
          retention-days: 30

      # `just build` is the single source of truth for the -ldflags that stamp
      # version/commit/date into the binary (see internal/buildinfo).
      - name: Build CLI
        run: just build

      - name: Verify version stamp
        run: bin/aconiq --version

      - name: Generate OpenAPI spec
        run: |
          mkdir -p docs/api
          bin/aconiq openapi --out docs/api/openapi.v1.json --server-url http://127.0.0.1:8080

      - name: Upload OpenAPI spec
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: docs/api/openapi.v1.json
          retention-days: 30

  # Race detector runs in its own job: a `-race` build is several times slower
  # than a plain `go test`, so running it alongside the main job rather than
  # inside it keeps total wall-clock time roughly unchanged.
  go-race:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Pinned tool versions
        uses: ./.github/actions/toolchain

      - name: Install just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Go tests (race detector)
        run: just test-race

  # Coverage. Advisory, and structurally so rather than merely by intent: this
  # is a separate job, it is deliberately NOT in the required-check set, and the
  # floor step carries `continue-on-error`. `go-ci` is required — a coverage
  # regression must never be able to block a merge, and a coverage *tooling*
  # failure must never be able to block one either.
  #
  # Separate from `go-ci` rather than a `just test-coverage` swapped in for
  # `just test`, for the same reason: those steps would then be inside the
  # required check. It costs one more run of the suite, in parallel, against a
  # gate whose verdict nobody should ever have to reason about.
  go-coverage:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # pull-requests: write is for the sticky comment below. Job-level
    # permissions replace the workflow-level ones rather than adding to them, so
    # contents: read is restated here.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Pinned tool versions
        uses: ./.github/actions/toolchain

      - name: Install just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Run tests with coverage
        id: tests
        run: just test-coverage

      # Gated on the test step, not on `always()`. `go test ./...` keeps going
      # after a package fails and still writes a profile for the packages that
      # completed — a file that is nonempty, plausible, and missing an arbitrary
      # slice of the denominator. coverage-check.sh's statement and file minima
      # catch a truncated run, not a few absent packages, so a partial profile
      # would be published as the headline number and have the floor enforced
      # against it.
      - name: Render the coverage report
        id: report
        if: always() && steps.tests.outcome == 'success'
        continue-on-error: true
        run: |
          if [ ! -s backend/coverage.out ]; then
            echo "has_coverage=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Backend test coverage"
              echo ""
              echo "**Not reported for this commit.** The tests passed but produced no"
              echo "coverage profile at \`backend/coverage.out\`."
            } >code-coverage-results.md
            cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "has_coverage=true" >> "$GITHUB_OUTPUT"
          just coverage-report
          cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

      # `!= 'success'` rather than `== 'failure'`: if checkout fails the test
      # step never runs and its outcome is `skipped`. Matching only `failure`
      # would leave the previous commit's sticky comment standing as this
      # commit's coverage. Say why there is no number, in the same two places
      # the number would have gone — staying silent is not neutral on a pull
      # request.
      - name: Explain the missing coverage report
        if: >-
          always() &&
          (steps.tests.outcome != 'success' || steps.report.outcome == 'failure')
        continue-on-error: true
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
        run: |
          case "${TESTS_OUTCOME}" in
            success) WHY="The tests passed, but rendering the report failed (\`${REPORT_OUTCOME}\`) — the profile is unreadable." ;;
            failure) WHY="The test run failed, so \`backend/coverage.out\` holds at most the packages that completed." ;;
            *)       WHY="The test run never started (\`${TESTS_OUTCOME}\`), so no profile was produced." ;;
          esac
          {
            echo "## Backend test coverage"
            echo ""
            echo "**Not reported for this commit.** ${WHY}"
            echo ""
            echo "A partial profile is not a coverage number: publishing it would put an"
            echo "arbitrary slice of the denominator on the pull request and enforce the"
            echo "floor against it. Fix the run and this job reports again."
          } >code-coverage-results.md
          cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

      # The SCRIPT, not `just coverage-check`: just has a single failure exit
      # status and so collapses the two cases the script exists to separate. 1
      # is a real regression and the percentage means what it says; 2 means the
      # profile or the configuration is not trustworthy and the percentage
      # should not be believed at all, in either direction.
      #
      # It runs BEFORE the comment is posted so the breach note below can reach
      # the Markdown that comment carries. Posting first would put a below-floor
      # percentage on the pull request looking like any other result.
      - name: Check the coverage floor
        id: floor
        if: always() && steps.report.outputs.has_coverage == 'true'
        continue-on-error: true
        env:
          # floor(78.9) - 2, measured 2026-09-17 on 317fdfa. Ratchet in
          # docs/testing/coverage.md, never silently here.
          COVERAGE_FLOOR: "76"
        run: |
          rc=0
          bash scripts/coverage-check.sh || rc=$?
          echo "status=${rc}" >> "$GITHUB_OUTPUT"
          exit "${rc}"

      # A non-fatal step failure is easy to miss in a long step list, so raise a
      # run-level annotation and put the warning into the report itself.
      #
      # The two cases get different words on purpose. A regression sends you
      # looking for missing tests; an untrustworthy measurement does not, and
      # may well be sitting comfortably above the floor while being worthless.
      - name: Flag a coverage problem
        if: >-
          always() &&
          ((steps.floor.outputs.status != '' && steps.floor.outputs.status != '0')
           || steps.floor.outcome == 'failure')
        continue-on-error: true
        env:
          FLOOR_STATUS: ${{ steps.floor.outputs.status }}
        run: |
          case "${FLOOR_STATUS}" in
            1)
              TITLE="Backend coverage below the floor"
              LEAD="**Backend coverage is below the floor.**"
              BODY="Advisory: it fails no required check and blocks no merge."
              ;;
            2)
              TITLE="Backend coverage number is not trustworthy"
              LEAD="**The backend coverage measurement failed its sanity checks.**"
              BODY="A tooling problem, not a coverage regression — the percentage above may be anything, including one comfortably over the floor. The step log says which check failed."
              ;;
            *)
              TITLE="Backend coverage check ended unexpectedly"
              LEAD="**The backend coverage check ended with status \`${FLOOR_STATUS:-unknown}\`.**"
              BODY="Neither a clean pass nor one of the documented failure codes. See the step log."
              ;;
          esac
          echo "::warning title=${TITLE}::Advisory only — it fails no check and blocks no merge. docs/testing/coverage.md has the policy."
          {
            echo ""
            echo "> ⚠️ ${LEAD}"
            echo "> ${BODY}"
            echo "> See docs/testing/coverage.md for the policy and the ratchet ledger."
          } | tee -a code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

      # Gated on the report FILE existing, never on `has_coverage`: every path
      # above writes one — the number, or the reason there is none — and a
      # sticky comment outlives the run that wrote it, so a skipped post leaves
      # the previous commit's percentage standing as if it were current.
      #
      # The same-repository guard plus `continue-on-error`: a fork pull request
      # gets a read-only GITHUB_TOKEN and cannot comment at all. Without both, a
      # comment failing to post would turn this job red after every test passed.
      - name: Post the coverage comment
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('code-coverage-results.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/sticky-comment.sh coverage-backend code-coverage-results.md

  # CVE scanning. Separate job for the same reason as go-race: independent of
  # every other gate, so there is no reason to serialise it behind them.
  govulncheck:
    runs-on: ubuntu-latest
    # issues: write is for the scheduled-failure report below. Job-level
    # permissions replace the workflow-level ones rather than adding to them, so
    # contents: read is restated here.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      # The installer builds govulncheck with the toolchain backend/go.mod
      # names, which is load-bearing: setup-go reads only the `go` directive and
      # ignores `toolchain`, so a govulncheck built by the older compiler cannot
      # load a module whose toolchain compiles a newer standard library, and
      # dies before it scans anything.
      - name: Pinned toolchain
        uses: ./.github/actions/toolchain
        with:
          install: vuln

      - name: Install just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Scan for known vulnerabilities
        run: just govulncheck

      # The early warning the blocking policy depends on: a scheduled failure
      # becomes an issue, so the advisory is known and actionable before it
      # stops somebody's pull request. One issue at a time — while it is open,
      # later scheduled failures only comment on it.
      - name: Report a scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: govulncheck is failing on main
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --search "in:title \"${TITLE}\"" \
            --json number --jq '.[0].number // empty')"

          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --body "Still failing: ${RUN_URL}"
            exit 0
          fi

          gh issue create --title "${TITLE}" --body "$(
            cat <<EOF
          \`just govulncheck\` failed on \`main\`: ${RUN_URL}

          govulncheck is a required status check, so this blocks every merge until it is
          resolved. Run \`just govulncheck\` for the finding. The usual remedies are a
          \`toolchain\` bump in \`backend/go.mod\` (standard-library advisories) or a
          dependency bump (module advisories); if neither applies, record the decision in
          \`docs/policies/vulnerability-scanning.md\`.
          EOF
          )"
