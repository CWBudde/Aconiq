name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; skip runs queued behind an already-running one.
concurrency:
  group: pages
  cancel-in-progress: true

# Deploying to production Pages used to happen on every push to `main` with no
# gate at all: a commit that broke the frontend, or the Go kernel the frontend
# runs, shipped regardless. The two check jobs below reproduce the CI gates for
# both halves of the repo and `build` waits on them.
#
# They are jobs here rather than a `workflow_run` trigger on Frontend CI / Go CI
# deliberately. `workflow_run` fires when *any one* listed workflow finishes, not
# when both pass, and Frontend CI is path-filtered — so a push touching neither
# tree would leave the deploy waiting on a workflow that never ran.
env:
  JUST_VERSION: 1.42.4

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with .github/workflows/frontend-ci.yml.
          bun-version: 1.3.7

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: bun run typecheck

      - name: Lint
        working-directory: frontend
        run: bun run lint

      - name: Test
        working-directory: frontend
        run: bun run test

  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Install just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: ${{ env.JUST_VERSION }}

      # The deployed page runs the Go kernel compiled to WASM, so the Go tests
      # gate this deployment just as much as the frontend ones do.
      - name: Go vet
        run: just vet

      - name: Go tests
        run: just test

  build:
    needs: [frontend-checks, backend-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Build WASM kernel
        working-directory: backend
        run: GOOS=js GOARCH=wasm go build -o ../frontend/public/aconiq.wasm ./cmd/wasm

      - name: Copy wasm_exec.js
        run: cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" frontend/public/wasm_exec.js

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned exactly (house style, cf. .trunk/trunk.yaml); keep in sync
          # with .github/workflows/frontend-ci.yml.
          bun-version: 1.3.7

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        # --base sets the public URL prefix; GitHub Pages serves from /<repo-name>/
        run: VITE_WASM_MODE=true bunx vite build --base=/${{ github.event.repository.name }}/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
