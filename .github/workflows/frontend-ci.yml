name: Frontend CI

# `backend/**` is in the filter because the frontend depends on the Go tree: the
# WASM kernel is built from backend/cmd/wasm and its call contract is mirrored by
# hand in src/wasm/types.ts, which src/wasm/surface-types.test.ts checks against
# the Go constants. Without it a backend-only change could break the frontend
# without ever running frontend CI.
#
# The `pull_request` trigger deliberately carries no paths filter, unlike the
# `push` one. `frontend-ci` is a required status check in the `default-branch`
# ruleset, and a workflow skipped by path filtering never reports its check at
# all — GitHub leaves the required context pending and the pull request can
# never merge. A docs-only pull request would deadlock on exactly that. Pushes
# keep the filter, because no merge gate depends on them.
#
# Pushes are scoped to `main` (i.e. after a merge) for the same reason as in
# go-ci.yml: with `branches: ["**"]` every pull request ran this workflow twice
# on the same commit, once per event.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned exactly (house style, cf. .trunk/trunk.yaml); keep in sync
          # with .github/workflows/gh-pages.yml.
          bun-version: 1.3.7

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: bun run typecheck

      - name: Lint
        working-directory: frontend
        run: bun run lint

      - name: Test
        working-directory: frontend
        run: bun run test

      - name: Build
        working-directory: frontend
        run: bun run build

      # Budgets are gzipped, so they only mean anything against a real build.
      - name: Bundle size budget
        working-directory: frontend
        run: bun run bundle-check
