name: Frontend CI

# `backend/**` is in the filter because the frontend depends on the Go tree, and
# since the parity tests landed it depends on it by compiling it: this job builds
# the WASM kernel from backend/cmd/wasm and runs it. src/wasm/kernel-parity
# checks the kernel against the CI-safe acceptance goldens, and
# src/api/browser-parity checks the browser run path against goldens the Go tree
# writes from GeoJSON models both targets read. A backend-only change can move
# either, so without this filter it could break the frontend without ever running
# frontend CI.
#
# The `pull_request` trigger deliberately carries no paths filter, unlike the
# `push` one. `frontend-ci` is a required status check in the `default-branch`
# ruleset, and a workflow skipped by path filtering never reports its check at
# all — GitHub leaves the required context pending and the pull request can
# never merge. A docs-only pull request would deadlock on exactly that. Pushes
# keep the filter, because no merge gate depends on them.
#
# Pushes are scoped to `main` (i.e. after a merge) for the same reason as in
# go-ci.yml: with `branches: ["**"]` every pull request ran this workflow twice
# on the same commit, once per event.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Before the Bun steps: `bun run test` runs the browser-CLI parity suites,
      # which load this artifact. ACONIQ_REQUIRE_WASM below turns a missing one
      # from a skip into a failure, so the build cannot be quietly lost.
      - name: Build the WASM kernel
        uses: ./.github/actions/wasm-kernel

      - name: Pinned tool versions
        uses: ./.github/actions/toolchain

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: bun run typecheck

      - name: Lint
        working-directory: frontend
        run: bun run lint

      - name: Test
        working-directory: frontend
        env:
          # Refuse to let the parity suites skip. Locally a missing kernel is a
          # skip, because it is a gitignored build output and a fresh checkout
          # has none; here its absence means the step above silently did
          # nothing, which is the one outcome that must be red.
          ACONIQ_REQUIRE_WASM: "1"
        run: bun run test

      - name: Build
        working-directory: frontend
        run: bun run build

      # Budgets are gzipped, so they only mean anything against a real build.
      - name: Bundle size budget
        working-directory: frontend
        run: bun run bundle-check

  # A separate job rather than more steps in `frontend-ci`: installing Chromium
  # and its system libraries costs minutes the unit gate does not need, and a
  # browser-side failure must not withhold the typecheck/lint/test verdict. Only
  # `frontend-ci` is a required check; this one reports on its own.
  #
  # Playwright starts the Vite dev server in WASM mode (playwright.config.ts),
  # which loads the kernel from frontend/public/, so the same kernel build runs
  # here first. The smoke suite and the axe accessibility baseline
  # (frontend/e2e/) both run through `bun run test:e2e`.
  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the WASM kernel
        uses: ./.github/actions/wasm-kernel

      - name: Pinned tool versions
        uses: ./.github/actions/toolchain

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      # Chromium only, matching the single project in playwright.config.ts;
      # --with-deps adds the shared libraries the runner image lacks.
      - name: Install Playwright browsers
        working-directory: frontend
        run: bunx playwright install --with-deps chromium

      - name: E2E tests
        working-directory: frontend
        run: bun run test:e2e

      # The HTML report carries the traces Playwright records on retry, which
      # is what a failure needs to be diagnosed without re-running it locally.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # Coverage. Advisory, and structurally so: a separate job, deliberately absent
  # from the required-check set, with the reporting steps carrying
  # `continue-on-error`. `frontend-ci` is the required check — a coverage
  # regression must never be able to block a merge.
  #
  # It builds the WASM kernel and requires the parity suites, exactly as
  # `frontend-ci` does. Without the kernel those four suites skip, `src/wasm/`
  # and a good deal of `browser-backend.ts` drop out of the covered set, and the
  # percentage would then depend on whether a build step ran rather than on what
  # is tested — a floor measured one way and enforced the other is a floor that
  # moves on its own.
  frontend-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the WASM kernel
        uses: ./.github/actions/wasm-kernel

      - name: Pinned tool versions
        uses: ./.github/actions/toolchain

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      # The floors live in vitest.config.ts and the run applies them itself, so
      # this step is what goes red on a breach. `continue-on-error` is what makes
      # "advisory" true rather than merely intended, and the outcome is read
      # below to say which of the two things happened.
      - name: Run tests with coverage
        id: tests
        continue-on-error: true
        working-directory: frontend
        env:
          # Same reason as in `frontend-ci`: locally a missing kernel is a skip,
          # here its absence would mean the build step silently did nothing —
          # and would quietly take four suites out of the coverage denominator.
          ACONIQ_REQUIRE_WASM: "1"
        run: bun run test:coverage

      # bun directly rather than through `just`, matching every other step in
      # this workflow: the frontend jobs never install just.
      - name: Render the coverage report
        id: report
        if: always()
        continue-on-error: true
        working-directory: frontend
        run: bun run scripts/coverage-report.mjs --out ../code-coverage-results-frontend.md

      # `reportOnFailure: true` in vitest.config.ts means a failing test still
      # writes the summary, so the report above usually succeeds even when the
      # run did not. This covers the case where it does not — and says so in the
      # same place the number would have gone, because a sticky comment that
      # goes quiet leaves the previous commit's numbers looking current.
      - name: Explain the missing coverage report
        if: always() && steps.report.outcome != 'success'
        continue-on-error: true
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          case "${TESTS_OUTCOME}" in
            failure) WHY="The test run failed and produced no readable coverage summary." ;;
            success) WHY="The tests passed, but rendering the report failed — the coverage summary is unreadable." ;;
            *)       WHY="The test run never started (\`${TESTS_OUTCOME}\`), so no coverage was measured." ;;
          esac
          cd frontend
          bun run scripts/coverage-report.mjs \
            --out ../code-coverage-results-frontend.md --unavailable "${WHY}"

      - name: Publish to the job summary
        if: always() && hashFiles('code-coverage-results-frontend.md') != ''
        continue-on-error: true
        run: cat code-coverage-results-frontend.md >> "$GITHUB_STEP_SUMMARY"

      # A threshold breach fails the test step, which is `continue-on-error`, so
      # it would otherwise be a quiet grey tick in a long step list.
      - name: Flag a coverage problem
        if: always() && steps.tests.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "::warning title=Frontend coverage or tests below the line::The coverage run failed — either a test failed or coverage is under the floors in frontend/vitest.config.ts. Advisory only; it fails no required check. docs/testing/coverage.md has the policy."
          {
            echo ""
            echo "> ⚠️ **The coverage run failed.** Either a test failed, or coverage is"
            echo "> below the floors in \`frontend/vitest.config.ts\` — the step log says"
            echo "> which. \`frontend-ci\` is the check that decides whether the tests pass;"
            echo "> this one is advisory."
            echo "> See docs/testing/coverage.md for the policy and the ratchet ledger."
          } | tee -a code-coverage-results-frontend.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post the coverage comment
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('code-coverage-results-frontend.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/sticky-comment.sh coverage-frontend code-coverage-results-frontend.md
