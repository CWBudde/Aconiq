name: Frontend CI

# `backend/**` is in the filter because the frontend depends on the Go tree, and
# since the parity tests landed it depends on it by compiling it: this job builds
# the WASM kernel from backend/cmd/wasm and runs it. src/wasm/kernel-parity
# checks the kernel against the CI-safe acceptance goldens, and
# src/api/browser-parity checks the browser run path against goldens the Go tree
# writes from GeoJSON models both targets read. A backend-only change can move
# either, so without this filter it could break the frontend without ever running
# frontend CI.
#
# The `pull_request` trigger deliberately carries no paths filter, unlike the
# `push` one. `frontend-ci` is a required status check in the `default-branch`
# ruleset, and a workflow skipped by path filtering never reports its check at
# all — GitHub leaves the required context pending and the pull request can
# never merge. A docs-only pull request would deadlock on exactly that. Pushes
# keep the filter, because no merge gate depends on them.
#
# Pushes are scoped to `main` (i.e. after a merge) for the same reason as in
# go-ci.yml: with `branches: ["**"]` every pull request ran this workflow twice
# on the same commit, once per event.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Before the Bun steps: `bun run test` runs the browser-CLI parity suites,
      # which load this artifact. ACONIQ_REQUIRE_WASM below turns a missing one
      # from a skip into a failure, so the build cannot be quietly lost.
      - name: Build the WASM kernel
        uses: ./.github/actions/wasm-kernel

      - name: Pinned tool versions
        uses: ./.github/actions/toolchain

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: bun run typecheck

      - name: Lint
        working-directory: frontend
        run: bun run lint

      - name: Test
        working-directory: frontend
        env:
          # Refuse to let the parity suites skip. Locally a missing kernel is a
          # skip, because it is a gitignored build output and a fresh checkout
          # has none; here its absence means the step above silently did
          # nothing, which is the one outcome that must be red.
          ACONIQ_REQUIRE_WASM: "1"
        run: bun run test

      - name: Build
        working-directory: frontend
        run: bun run build

      # Budgets are gzipped, so they only mean anything against a real build.
      - name: Bundle size budget
        working-directory: frontend
        run: bun run bundle-check

  # A separate job rather than more steps in `frontend-ci`: installing Chromium
  # and its system libraries costs minutes the unit gate does not need, and a
  # browser-side failure must not withhold the typecheck/lint/test verdict. Only
  # `frontend-ci` is a required check; this one reports on its own.
  #
  # Playwright starts the Vite dev server in WASM mode (playwright.config.ts),
  # which loads the kernel from frontend/public/, so the same kernel build runs
  # here first. The smoke suite and the axe accessibility baseline
  # (frontend/e2e/) both run through `bun run test:e2e`.
  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the WASM kernel
        uses: ./.github/actions/wasm-kernel

      - name: Pinned tool versions
        uses: ./.github/actions/toolchain

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      # Chromium only, matching the single project in playwright.config.ts;
      # --with-deps adds the shared libraries the runner image lacks.
      - name: Install Playwright browsers
        working-directory: frontend
        run: bunx playwright install --with-deps chromium

      - name: E2E tests
        working-directory: frontend
        run: bun run test:e2e

      # The HTML report carries the traces Playwright records on retry, which
      # is what a failure needs to be diagnosed without re-running it locally.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
