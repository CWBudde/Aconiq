# treefmt configuration for Aconiq
# Multi-language code formatting

[global]
excludes = [
    # Git and version control
    "**/.gitignore",
    "**/.git/**",

    # Go module files (managed by go tooling)
    "go.sum",
    "go.mod",

    # Documentation and text files
    "**/*.txt",
    "CHANGELOG.md",
    "LICENSE",

    # Binary and data files
    "**/*.wav",
    "**/*.pdf",
    "**/*.png",
    "**/*.jpg",
    "**/*.jpeg",

    # Build artifacts
    "bin/**",
    "dist/**",
    "frontend/node_modules/**",
    "coverage.out",
    "coverage.html",

    # Golden test snapshots (managed by test tooling)
    "**/testdata/**",
]

# Go formatter - simple and strict
[formatter.gofumpt]
command = "gofumpt"
options = ["-w"]
includes = ["*.go"]

# Go import organizer - runs after gofumpt
[formatter.gci]
command = "gci"
options = ["write"]
includes = ["*.go"]
priority = 1

# Shell script checker. -x follows sourced files (scripts/ source tools.versions),
# which shellcheck otherwise reports as an unresolved source.
[formatter.shellcheck]
command = "shellcheck"
options = ["-x"]
includes = ["*.sh"]

# Shell script formatter - runs after shellcheck
[formatter.shfmt]
command = "shfmt"
options = ["-s", "-w"]
includes = ["*.sh"]
priority = 1

# Markdown, YAML, JSON, and frontend formatter
[formatter.prettier]
command = "prettier"
options = ["-w"]
includes = [
    "*.md",
    "*.yaml",
    "*.yml",
    "*.json",
    "*.ts",
    "*.tsx",
    "*.css",
    "*.html",
]
excludes = [
    "**/*.sops.*",
    # Go files are handled by gofumpt/gci
    "*.go",
    # Generated from the API's OpenAPI document by
    # frontend/scripts/generate-api-client.mjs, which writes it with the
    # TypeScript printer and then compares the bytes against the committed
    # copy. Two writers for one file is two formatters disagreeing: prettier
    # would reformat what the generator wrote, and `just fe-api-check` would
    # then report an API change on every run. One writer, and the diff check
    # is the review.
    "frontend/src/api/schema.ts",
]
